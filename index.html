<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0710">
<meta name="description" content="세계의 축제를 손으로 만지는 곳. 축제마다 그 축제로 만든 작은 세계에서 눌러보고, 쓸어보고, 캡슐로 오늘의 축제를 뽑아요.">
<meta property="og:title" content="FÊTE">
<meta property="og:description" content="세계의 축제를 손으로 만지는 곳">
<meta property="og:image" content="img/yi-peng.jpg">
<title>FÊTE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@1,9..144,500..700,100,1&family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="blur"></div>
<div class="frame" id="frame">
  <div class="track" id="track"></div>
  <div class="gest" id="gest"></div>
  <div class="ui">
    <span class="mark">FÊTE</span>
    <div class="right"><div class="dots" id="dots"></div><button class="gbtn" id="gopen"><i></i>뽑기</button></div>
  </div>
  <div class="ticks" id="ticks"></div>
  <div class="hint" id="hint"><div class="ring"></div>눌러보세요<br><span style="opacity:.8;font-size:12px">위로 쓸면 다음 축제</span></div>
  <form id="wishbar" autocomplete="off"><input id="wish" maxlength="20" aria-label="입력"><button id="wishgo" type="submit">띄우기</button></form>
</div>

<section id="gacha" aria-label="오늘의 축제 뽑기">
  <button class="gx" id="gclose">닫기 ✕</button>
  <div class="gtitle">오늘의 축제 뽑기</div>
  <div class="gsub">손잡이를 세 번 돌려요</div>
  <div class="machine" id="machine">
    <div class="globe" id="globe"></div>
    <div class="gbody"><button class="knob" id="knob" aria-label="손잡이 돌리기"><i></i></button><div class="slot"></div></div>
    <div class="tray"></div>
  </div>
  <div class="ghint" id="ghint">손잡이를 눌러요 (0/3)</div>
  <div id="gres"></div>
</section>
<script src="js/data.js"></script>
<script src="js/core.js"></script>
<script src="js/scenes.js"></script>
<script src="js/gacha.js"></script>
</body>
</html>
